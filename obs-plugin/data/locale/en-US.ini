Beauty.Bright="Brighten"
Beauty.Help="Applied on the phone before sending (no PC load). Skin smoothing softens skin-colored areas while keeping edges; Brighten lifts dark areas more. Also adjustable in the phone app settings. Not applied in the free version or in CamNeuron app versions before 0.2.2."
Group.Remote="Run the stream from the phone"
Remote.Help="Run the stream from the phone when you are away from the PC. The phone app's 'Stream' panel switches scenes, mutes mics, shows the stream time and 'View PC screen' (the picture and sound this OBS is sending). 'Switch to phone' changes to the phone scene below and mutes the PC mics; 'Back to PC' restores the scene and mics. Requires CamNeuron app 0.2.3 or later."
Remote.PhoneScene="Phone scene"
Remote.PhoneScene.Auto="Automatic (the scene where this phone camera is largest)"
