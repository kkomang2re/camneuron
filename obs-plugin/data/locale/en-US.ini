Overlay.Help="Paste the CHZZK studio widget URLs (the ones for an OBS browser source) to show them as windows on the phone. Move, resize and zoom them in the phone app under 'Chat/Alerts'. 'Include in stream' composites them onto this camera at the same position; otherwise they are only shown on the phone (keep it off if OBS already shows the same widget)."
