Status.Disconnected="Not connected. Open the CamNeuron app and check the address. If the phone's IP changed, it is found again automatically after a few seconds."
Status.Searching="Searching for the phone... Keep the CamNeuron app open on the same Wi-Fi."
Status.PairRequired="🔒 This PC is connecting for the first time. Enter the 6-digit code shown on the phone in 'Pairing code' below (only once; it connects directly from then on)."
Status.BadCode="🔒 Wrong code (%d tries left before the phone locks). Check the code on the phone and enter it again."
Status.Locked="🔒 Too many wrong codes. The phone ignores codes for about %d seconds; then enter the new code shown on the phone."
Status.Version="The phone app and the plugin use different versions (phone: v%d, plugin: v%d). Update both to the same version."
Status.Closed="The phone closed the connection without answering. If the phone app is an older version, update it to match the plugin."
PairCode="Pairing code (6 digits on the phone)"
