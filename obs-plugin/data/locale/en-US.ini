Remote.RemoveMics="Remove mics from this track (recommended: so you don't hear your own voice late)"
Remote.MicsRemoved="Removed %d mic(s) from audio track %d. You can turn them back on in Advanced Audio Properties."
Remote.LostScene="Scene when the phone drops"
Remote.LostScene.None="Don't switch"
Remote.LostScene.Help="While you stream after 'Switch to phone', if the phone's video stops for more than 3 seconds (weak Wi-Fi), switch to this scene, and go back to the previous scene when it returns. For example a 'Be right back' scene."
