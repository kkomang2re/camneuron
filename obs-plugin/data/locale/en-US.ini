Status.Heat="⚠ The phone is hot and sends lower quality (level %d, %.1f Mbps). The quality settings below are kept; the phone restores one level every 3 minutes once it cools down."
Status.Net="⚠ The phone's Wi-Fi is weak and it sends lower quality (level %d, %.1f Mbps). The quality settings below are kept; the phone restores one level every 15 seconds once the signal improves."
Status.BatteryLow="⚠ Phone battery at %d%% and not charging. The stream picture stops if the phone turns off; plug in a charger or power bank."
Status.FreeLimit="ℹ CamNeuron on the phone is the free version, so it sends at most 720p 30 fps H.264. Buy Pro in the phone app settings to get the quality set below."
